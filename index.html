<!doctype html>
<html lang="en" class="dark" style="background-color: #020617; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast Share - Lightning Fast File Transfer</title>
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Fast, secure, and easy peer-to-peer file sharing directly in your browser." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <style>
      :root {
        color-scheme: dark;
        background-color: #020617;
      }
      html, body {
        background-color: #020617 !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        min-height: 100vh;
        background-color: #020617;
      }
      @keyframes fs-pulse-glow {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.88; }
      }
      @keyframes fs-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .fs-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        color: #f8fafc;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .fs-icon-box {
        position: relative;
        width: 72px;
        height: 72px;
        border-radius: 24px;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px -5px rgba(37, 99, 235, 0.45);
        animation: fs-pulse-glow 2.2s infinite ease-in-out;
        margin-bottom: 20px;
      }
      .fs-spin-ring {
        position: absolute;
        inset: -6px;
        border-radius: 28px;
        border: 2px dashed rgba(59, 130, 246, 0.4);
        animation: fs-spin 8s linear infinite;
      }
    </style>
  </head>
  <body style="background-color: #020617; color: #f8fafc; margin: 0; min-height: 100vh;">
    <div id="root">
      <div class="fs-preloader">
        <div class="fs-icon-box">
          <div class="fs-spin-ring"></div>
          <svg style="width: 36px; height: 36px; color: white;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div style="font-size: 24px; font-weight: 900; letter-spacing: -0.04em; margin-bottom: 6px; background: linear-gradient(to right, #ffffff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Fast Share</div>
        <div id="fs-loader-text" style="font-size: 13px; color: #64748b; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;">Loading application...</div>
      </div>
      <script>
        try {
          if (sessionStorage.getItem('fs_reset_reloaded') === 'true') {
            var el = document.getElementById('fs-loader-text');
            if (el) el.innerText = 'Restoring Fast Share...';
          }
        } catch (e) {}
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
